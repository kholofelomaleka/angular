services:
  # Nginx Reverse Proxy for Jenkins
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - jenkins

  # Jenkins Controller
  jenkins:
    build: ./jenkins
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Allows Jenkins to run Docker
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

  # Jenkins Agent (The worker)
  jenkins-agent:
    image: jenkins/ssh-agent:latest-jdk17
    privileged: true
    environment:
      - JENKINS_AGENT_SSH_PUBKEY=your_ssh_public_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
